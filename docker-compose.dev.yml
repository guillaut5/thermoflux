# Socle de developpement (etape 1) : seulement les deux composants officiels.
# Les programmes maison (simulateur, ingestion, migrate) se lancent a part,
# voir INSTALL.md. Le docker-compose.yml complet viendra a l'etape 2.
name: thermoflux

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      # 1884 cote hote : evite le conflit avec un Mosquitto deja installe sur Windows
      - "127.0.0.1:${MQTT_HOST_PORT:-1884}:1883"
    entrypoint: ["/bin/sh", "/mosquitto/init.sh"]
    environment:
      MQTT_SIMULATEUR_PASSWORD: ${MQTT_SIMULATEUR_PASSWORD:?voir .env.example}
      MQTT_INGESTION_PASSWORD: ${MQTT_INGESTION_PASSWORD:?voir .env.example}
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/init.sh:/mosquitto/init.sh:ro

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?voir .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?voir .env.example}
      POSTGRES_DB: ${POSTGRES_DB:?voir .env.example}
    ports:
      # 5433 cote hote : evite le conflit avec un Postgres deja installe sur Windows
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:

networks:
  default:
    name: thermoflux-dev
