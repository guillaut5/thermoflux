<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>thermoflux — connexion</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; color: #1c1e21;
           display: flex; min-height: 100vh; align-items: center; justify-content: center; margin: 0; }
    form { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 1px 6px rgba(0,0,0,.15);
           width: 100%; max-width: 20rem; }
    h1 { margin: 0 0 1.2rem; font-size: 1.4rem; }
    label { display: block; margin-top: .8rem; font-size: .9rem; }
    input { width: 100%; box-sizing: border-box; padding: .5rem; margin-top: .25rem; font-size: 1rem; }
    button { margin-top: 1.2rem; width: 100%; padding: .6rem; font-size: 1rem; cursor: pointer; }
    .error { color: #b3261e; margin-top: .8rem; }
    @media (prefers-color-scheme: dark) {
      body { background: #15171a; color: #e6e6e6; }
      form { background: #1f2226; box-shadow: none; }
      input, button { background: #2a2e33; color: inherit; border: 1px solid #444; border-radius: 4px; }
      .error { color: #f2b8b5; }
    }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h1>thermoflux</h1>
    <label>Utilisateur
      <input name="username" autocomplete="username" required autofocus>
    </label>
    <label>Mot de passe
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <button type="submit">Se connecter</button>
  </form>
</body>
</html>
